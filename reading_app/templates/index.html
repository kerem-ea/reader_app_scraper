<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reader</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="bar">
    <select id="siteSelect"></select>
    <select id="tocSelect"></select>
    <div class="controls">
      <span>Size <input id="fontSize" type="range" min="12" max="48" step="1" value="20"></span>
      <span>Height <input id="lineHeight" type="range" min="1.2" max="3" step="0.05" value="1.8"></span>
      <span>Width <input id="readWidth" type="range" min="400" max="1200" value="800"></span>
      <span>Soft <input id="softFont" type="checkbox" checked></span>
      <span>Dark <input id="themeToggle" type="checkbox" checked></span>
      <button id="markReadBtn">Mark</button>
      <button id="closeBtn">×</button>
    </div>
  </header>

  <main id="reader">
    <h1 id="chapterTitle"></h1>
    <div id="chapterContent"></div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
